name: Build Windows App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package application
        run: npm run make

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = "out\PrismPulseApp-win32-x64\PrismPulseApp.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected build output not found at $exe"
          }

      - name: Upload packaged build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismPulseApp-win32-x64
          path: out/PrismPulseApp-win32-x64
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path "out\make" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".zip", ".nupkg" }

          if ($assets.Count -eq 0) {
            throw "No release assets found under out\make"
          }

          gh release create "${{ github.ref_name }}" @($assets.FullName) `
            --repo "${{ github.repository }}" `
            --title "PrismPulse ${{ github.ref_name }}" `
            --generate-notes
