name: Build Windows App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate SignPath configuration
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG
            SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "Configure the following GitHub Actions values before creating a release: $($missing -join ', ')"
          }

      - name: Package application
        run: npm run package

      - name: Verify packaged executable exists
        shell: pwsh
        run: |
          $exe = "out\PrismPulse-win32-x64\PrismPulse.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected build output not found at $exe"
          }

      - name: Upload unsigned PrismPulse application
        if: startsWith(github.ref, 'refs/tags/v')
        id: upload-unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: PrismPulse-app-unsigned
          path: out/PrismPulse-win32-x64/PrismPulse.exe
          if-no-files-found: error

      - name: Sign PrismPulse application with SignPath
        if: startsWith(github.ref, 'refs/tags/v')
        id: sign-app
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/prismpulse-signed-app

      - name: Install and verify signed PrismPulse application
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $signedFiles = @(Get-ChildItem "$env:RUNNER_TEMP\prismpulse-signed-app" -Filter "PrismPulse.exe" -File -Recurse)
          if ($signedFiles.Count -ne 1) {
            throw "SignPath must return exactly one PrismPulse.exe; found $($signedFiles.Count)."
          }
          $destination = "out\PrismPulse-win32-x64\PrismPulse.exe"
          Copy-Item $signedFiles[0].FullName $destination -Force
          $signature = Get-AuthenticodeSignature $destination
          if ($signature.Status -ne "Valid") {
            throw "SignPath-signed PrismPulse.exe signature verification failed: $($signature.StatusMessage)"
          }

      - name: Build PrismPulse Setup executable
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found"
          }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed to build PrismPulse-Setup.exe"
          }

      - name: Upload unsigned PrismPulse Setup
        if: startsWith(github.ref, 'refs/tags/v')
        id: upload-unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: PrismPulse-setup-unsigned
          path: out/installer/PrismPulse-Setup.exe
          if-no-files-found: error

      - name: Sign PrismPulse Setup with SignPath
        if: startsWith(github.ref, 'refs/tags/v')
        id: sign-setup
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/prismpulse-signed-setup

      - name: Install and verify signed PrismPulse Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $setup = "out\installer\PrismPulse-Setup.exe"
          $signedFiles = @(Get-ChildItem "$env:RUNNER_TEMP\prismpulse-signed-setup" -Filter "PrismPulse-Setup.exe" -File -Recurse)
          if ($signedFiles.Count -ne 1) {
            throw "SignPath must return exactly one PrismPulse-Setup.exe; found $($signedFiles.Count)."
          }
          Copy-Item $signedFiles[0].FullName $setup -Force
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne "Valid") {
            throw "SignPath-signed setup signature verification failed: $($signature.StatusMessage)"
          }

      - name: Verify setup installs the app executable
        shell: pwsh
        run: |
          $setup = "out\installer\PrismPulse-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "PrismPulse-Setup.exe was not created"
          }
          $setupPath = (Resolve-Path $setup).Path

          $rejectedDir = Join-Path $env:RUNNER_TEMP "PrismPulse-Install-Rejected"
          $rejected = Start-Process -FilePath $setupPath `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$rejectedDir") `
            -Wait -PassThru
          if ($rejected.ExitCode -eq 0 -or (Test-Path $rejectedDir)) {
            throw "Silent setup must reject installation unless /ACCEPTTERMS is supplied."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "PrismPulse-Install-Test"
          $install = Start-Process -FilePath $setupPath `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ACCEPTTERMS", "/DIR=$installDir") `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "PrismPulse-Setup.exe failed with exit code $($install.ExitCode)"
          }

          $appExe = Join-Path $installDir "PrismPulse.exe"
          if (-not (Test-Path $appExe)) {
            throw "Setup completed but did not install PrismPulse.exe"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Installed app is missing its uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "PrismPulse uninstall test failed with exit code $($uninstall.ExitCode)"
          }

      - name: Upload packaged build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismPulse-win32-x64
          path: |
            out/PrismPulse-win32-x64
            out/installer/PrismPulse-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "out\installer\PrismPulse-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "PrismPulse-Setup.exe is missing from release output"
          }

          gh release create "${{ github.ref_name }}" $setup `
            --repo "${{ github.repository }}" `
            --title "PrismPulse ${{ github.ref_name }}" `
            --generate-notes
